name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare bundled web app
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor 8
        run: |
          npm init -y
          npm install --save-exact @capacitor/core@8.0.0 @capacitor/cli@8.0.0 @capacitor/android@8.0.0

      - name: Create Android project
        run: |
          npx cap init "Coordinator App" "kr.nonsan.coordinator" --web-dir www
          npx cap add android

      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]
          missing = [p for p in permissions if p not in text]
          if missing:
              insert = "\n".join("    " + p for p in missing)
              text = re.sub(r"(<manifest[^>]*>)", r"\1\n" + insert, text, count=1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure Android 16 and app version
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")
          v = variables.read_text(encoding="utf-8")
          v = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", v)
          v = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", v)
          v = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", v)
          variables.write_text(v, encoding="utf-8")

          app = Path("android/app/build.gradle")
          a = app.read_text(encoding="utf-8")
          a, c1 = re.subn(r"versionCode\s+\d+", "versionCode 52", a, count=1)
          a, c2 = re.subn(r'versionName\s+"[^"]+"', 'versionName "6.1"', a, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("versionCode/versionName update failed")
          app.write_text(a, encoding="utf-8")

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          w = wrapper.read_text(encoding="utf-8")
          if "networkTimeout=" in w:
              w = re.sub(r"networkTimeout=.*", "networkTimeout=600000", w)
          else:
              w += "\nnetworkTimeout=600000\n"
          wrapper.write_text(w, encoding="utf-8")
          PY

          echo "Android SDK versions"
          grep -n "minSdkVersion\|compileSdkVersion\|targetSdkVersion" android/variables.gradle
          echo "Android app version"
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "Android Gradle Plugin"
          grep -n "com.android.tools.build:gradle" android/build.gradle || true
          echo "Gradle wrapper"
          grep -n "distributionUrl" android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/coordinator.keystore

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("coordinator.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEYSTORE_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-release-6.1-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-release-6.1-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
